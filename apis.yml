aid: shopup
name: ShopUp
description: >-
  ShopUp is a Bangladesh technology company that digitizes the country's small-business
  supply chain, connecting mills and manufacturers to a network of hundreds of thousands
  of neighbourhood shops. It operates Mokam, a B2B commerce platform where small retailers
  source fast-moving consumer goods at fair prices, and REDX, a nationwide last-mile
  logistics and courier network reaching sub-districts across all 64 districts. REDX
  publishes a public merchant Open API that lets e-commerce sellers create and track
  parcels and manage pickup stores programmatically. ShopUp is backed by Prosus Ventures
  and in 2025 combined with Saudi Arabia's Sary to form the SILQ Group.
